    <path d="M62 26 q6 30 -4 46 q14 -4 12 -30 z" fill="#3B2A4A"/>
    <circle cx="24" cy="32" r="3" fill="#3B2A4A"/><circle cx="44" cy="32" r="3" fill="#3B2A4A"/>
