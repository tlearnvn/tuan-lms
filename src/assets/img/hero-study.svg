    <linearGradient id="hs-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/><stop offset="1" stop-color="#A29BFE"/>
    </linearGradient>
    <linearGradient id="hs-shirt2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7675"/><stop offset="1" stop-color="#FDA7A6"/>
    </linearGradient>
  </defs>

  <!-- vòng nền -->
  <circle cx="260" cy="196" r="176" fill="#ffffff" opacity=".13"/>
  <circle cx="260" cy="196" r="138" fill="#ffffff" opacity=".1"/>

  <!-- biểu tượng bay -->
  <g opacity=".95">
    <g transform="translate(58 54)">
      <rect x="-16" y="-16" width="42" height="42" rx="13" fill="#FDCB6E"/>
      <path d="M-6 4 l6 6 l12 -14" stroke="#8A5B00" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(452 96)">
      <rect x="-16" y="-16" width="42" height="42" rx="13" fill="#55EFC4"/>
      <path d="M-6 -4 h20 M-6 3 h20 M-6 10 h12" stroke="#046B4F" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <g transform="translate(430 286)">
      <circle r="21" fill="#74B9FF"/>
      <path d="M-9 0 a9 9 0 0 1 18 0 a9 9 0 0 1 -18 0 M0 -12 v24 M-12 0 h24" stroke="#0B4C8A" stroke-width="2.4" fill="none"/>
    </g>
    <g transform="translate(70 300)">
