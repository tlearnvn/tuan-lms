<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-label="Học sinh học trực tuyến">
  <defs>
    <linearGradient id="hs-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#E8E6FF"/>
    </linearGradient>
    <linearGradient id="hs-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9A0"/><stop offset="1" stop-color="#F0B970"/>
