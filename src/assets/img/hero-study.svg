  <!-- cây cảnh -->
  <g transform="translate(108 232)">
    <path d="M18 56 q-16 -22 -4 -40 q10 12 8 40z" fill="#00B894"/>
    <path d="M18 56 q18 -18 10 -38 q-14 12 -12 38z" fill="#55EFC4"/>
    <path d="M4 54 h30 l-4 26 h-22z" fill="#E17055"/>
