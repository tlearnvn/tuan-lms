    <rect x="188" y="158" width="160" height="104" rx="8" fill="url(#hs-screen)"/>
    <rect x="200" y="172" width="70" height="9" rx="4.5" fill="#6C5CE7"/>
    <rect x="200" y="190" width="120" height="7" rx="3.5" fill="#C9C4F0"/>
    <rect x="200" y="204" width="98" height="7" rx="3.5" fill="#C9C4F0"/>
    <rect x="200" y="222" width="52" height="20" rx="10" fill="#00B894"/>
    <path d="M216 228 l4 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="262" y="222" width="52" height="20" rx="10" fill="#FDCB6E"/>
    <rect x="248" y="270" width="40" height="12" rx="4" fill="#2E2B4F"/>
