  <!-- bàn học -->
  <rect x="96" y="286" width="330" height="16" rx="8" fill="url(#hs-desk)"/>
  <rect x="126" y="302" width="16" height="58" rx="7" fill="#E0A55E"/>
  <rect x="380" y="302" width="16" height="58" rx="7" fill="#E0A55E"/>

