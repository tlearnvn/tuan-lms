    <circle cx="32" cy="30" r="25" fill="#F5C395"/>
    <path d="M6 26 q4 -30 26 -30 t26 30 q-10 -12 -26 -10 t-26 10" fill="#2F2A3F"/>
    <circle cx="23" cy="31" r="3" fill="#2F2A3F"/><circle cx="42" cy="31" r="3" fill="#2F2A3F"/>
    <path d="M25 41 q7 6 14 0" stroke="#C6544F" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M6 64 q-30 6 -34 24" stroke="#F5C395" stroke-width="13" fill="none" stroke-linecap="round"/>
