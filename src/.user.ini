; ============================================================
;  Hệ thống LMS – giới hạn PHP cho hosting dùng PHP-FPM / CGI
;  (cPanel: đa số dùng tệp này thay cho php_value trong .htaccess)
;  Sau khi sửa, chờ khoảng 5 phút hoặc bấm "Restart PHP" trong cPanel.
; ============================================================

; Dung lượng tệp học liệu tải lên
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 30

; Bộ nhớ và thời gian chạy (tải tệp lớn, chấm bài bằng AI)
memory_limit = 256M
max_execution_time = 600
max_input_time = 600
max_input_vars = 5000

; Phiên làm việc dài để học sinh làm bài không bị đăng xuất (12 giờ)
session.gc_maxlifetime = 43200
session.cookie_httponly = 1
session.use_strict_mode = 1

; Múi giờ Việt Nam
date.timezone = "Asia/Ho_Chi_Minh"

; Không hiển thị lỗi ra trình duyệt trên máy chủ thật
display_errors = Off
log_errors = On
